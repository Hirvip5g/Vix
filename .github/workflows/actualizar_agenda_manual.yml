name: Actualizar Agenda Automática

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta automáticamente cada 6 horas

permissions:
  contents: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Procesar Agenda
        env:
          AGENDA_URL: ${{ secrets.AGENDA_URL }}
        run: python procesar_eventos_manual.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Agenda actualizada automáticamente" || exit 0
          
          # Actualiza el repositorio local trayendo los cambios remotos y aplicando los tuyos encima
          git pull --rebase origin main
          
          # Envía los cambios a la rama main de forma explícita
          git push origin main
```[cite: 1]

### ¿Qué ha cambiado?
1. **`schedule` y `cron: '0 */6 * * *'`**: Esta línea le indica a GitHub Actions que ejecute este flujo de trabajo al minuto `0` de cada hora que sea múltiplo de 6 (es decir, a las 00:00, 06:00, 12:00 y 18:00 UTC).
2. **`workflow_dispatch`**: Se mantiene conservado para que sigas teniendo la opción de lanzarlo de manera manual cuando lo necesites[cite: 1].
3. **Mensaje de commit**: Se ajustó ligeramente para reflejar que la actualización ahora también es automática, aunque puedes cambiarlo a tu gusto.

*Nota:* Las ejecuciones programadas (`schedule`) en GitHub Actions utilizan el horario **UTC** y pueden tener un pequeño retraso de unos minutos dependiendo de la carga de los servidores de GitHub en ese momento.
